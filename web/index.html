<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Petoteco Smart Pet Health">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Petoteco">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Petoteco</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body,
    * {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #FAF7F2;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body,
    flt-glass-pane,
    flt-scene-host,
    flt-semantics-host,
    flt-semantics,
    flt-semantics-placeholder,
    flutter-view,
    flutter-view *,
    canvas {
      outline: none !important;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    ::selection {
      background: transparent;
    }

    input,
    textarea,
    [contenteditable="true"],
    flt-text-editing-host,
    flt-text-editing-host * {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>

  <!-- FCM 助手：不在此加载 Firebase SDK，避免干扰 Google 登录 -->
  <script src="fcm_token_helper.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
