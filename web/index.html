<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Petoteco Smart Pet Health">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Petoteco">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Petoteco</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // gh-pages 子路径：先清旧 SW，再注册 FCM SW（相对 base href）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) {
            return Promise.all(regs.map(function (r) {
              var url = (r.active && r.active.scriptURL) ||
                        (r.installing && r.installing.scriptURL) ||
                        (r.waiting && r.waiting.scriptURL) || '';
              if (url.indexOf('firebase-messaging-sw') >= 0) return Promise.resolve();
              return r.unregister();
            }));
          })
          .then(function () {
            return navigator.serviceWorker.register('firebase-messaging-sw.js');
          })
          .then(function (reg) {
            console.log('[FCM SW] registered:', reg.scope);
          })
          .catch(function (err) {
            console.error('[FCM SW] register failed:', err);
          });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
