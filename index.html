<!DOCTYPE html>
<html>
<head>
  <base href="/calmpaws-petoteco/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Petoteco Smart Pet Health">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Petoteco">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Petoteco</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 清除旧 Flutter Service Worker，保留 FCM 专用 SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          const url = registration.active?.scriptURL || registration.installing?.scriptURL || '';
          if (url.includes('firebase-messaging-sw')) continue;
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(function(cacheNames) {
          cacheNames.forEach(function(cacheName) {
            caches.delete(cacheName);
          });
        });
      }
      // gh-pages 子路径：相对 base href 注册 FCM SW（否则 getToken 404）
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './' })
          .catch(function (err) { console.warn('[FCM SW] register failed:', err); });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
